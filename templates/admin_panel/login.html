<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Graduate-Connect</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 1.5rem;
    }

    .card {
      width: 100%; max-width: 420px;
      background: rgba(30, 41, 59, 0.97);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 60px rgba(0,0,0,0.55);
    }

    .logo-wrap {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 2rem;
    }
    .logo-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(99,102,241,0.45);
    }
    .logo-icon svg { width: 32px; height: 32px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { color: #f1f5f9; font-size: 1.5rem; font-weight: 800; }
    .subtitle { color: #64748b; font-size: 0.82rem; margin-top: 0.3rem; }

    .error-box {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.35);
      border-radius: 8px; padding: 0.75rem 1rem;
      color: #fca5a5; font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: flex; align-items: center; gap: 0.5rem;
    }

    .field { margin-bottom: 1rem; }
    label {
      display: block; color: #94a3b8; font-size: 0.75rem;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }
    input[type="email"], input[type="password"] {
      width: 100%; padding: 0.7rem 0.875rem;
      background: rgba(15,23,42,0.8);
      border: 1.5px solid rgba(99,102,241,0.25);
      border-radius: 8px; color: #f1f5f9;
      font-size: 0.9rem; outline: none;
      transition: border-color 150ms;
    }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }

    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 2.75rem; }
    .toggle-pw {
      position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #64748b; padding: 0;
    }
    .toggle-pw:hover { color: #94a3b8; }

    .btn-submit {
      width: 100%; padding: 0.8rem; margin-top: 0.75rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none; border-radius: 10px;
      color: #fff; font-size: 0.95rem; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99,102,241,0.4);
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      transition: opacity 150ms;
    }
    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:active { opacity: 0.8; }

    .back-link {
      text-align: center; margin-top: 1.5rem;
      color: #475569; font-size: 0.78rem;
    }
    .back-link a { color: #6366f1; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }

    .badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.2);
      border-radius: 20px; padding: 0.25rem 0.75rem;
      color: #a5b4fc; font-size: 0.72rem; font-weight: 600;
      margin-top: 0.5rem; letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="logo-wrap">
      <div class="logo-icon">
        <!-- Shield-check icon -->
        <svg viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      </div>
      <h1>Admin Portal</h1>
      <p class="subtitle">Graduate-Connect — Restricted Access</p>
      <span class="badge">🔒 Administrators Only</span>
    </div>

    {% if error %}
    <div class="error-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ error }}
    </div>
    {% endif %}

    {% if messages %}
    {% for msg in messages %}
    <div class="error-box" style="background:rgba(34,197,94,0.1);border-color:rgba(34,197,94,0.3);color:#86efac;">
      {{ msg }}
    </div>
    {% endfor %}
    {% endif %}

    <form method="post" autocomplete="off">
      {% csrf_token %}

      <div class="field">
        <label for="email">Admin Email</label>
        <input type="email" id="email" name="email"
               placeholder="admin@example.com"
               value="{{ request.POST.email }}"
               required autofocus />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password"
                 placeholder="••••••••" required />
          <button type="button" class="toggle-pw" onclick="togglePw()" title="Show/hide password">
            <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Sign In to Admin Panel
      </button>
    </form>

    <p class="back-link">
      Not an administrator? <a href="/">Go to main app</a>
    </p>
  </div>

  <script>
    function togglePw() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
