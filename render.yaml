services:
  # ── Django Backend (Web Service) ─────────────────────────────────────────────
  - type: web
    name: graduate-connect-api
    runtime: python
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn graduate_connect.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    rootDir: .
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: graduate-connect-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "graduate-connect-api.onrender.com,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://graduate-connect-frontend.onrender.com,https://graduate-connect-frontend-2.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── React Frontend (Static Site) ─────────────────────────────────────────────
  - type: web
    name: graduate-connect-frontend
    runtime: static
    rootDir: linkedin-react-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: "https://graduate-connect-api.onrender.com/api"
      - key: VITE_ENV
        value: "production"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ── PostgreSQL (Free tier — 90-day rotation) ──────────────────────────────────
  - name: graduate-connect-db
    databaseName: graduate_connect
    user: graduate_connect_user
    region: oregon
